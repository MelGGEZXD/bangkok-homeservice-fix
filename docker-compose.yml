# Area A: the only published entry point. nginx routes each extracted context (notifications,
# payments) to its own service with its own database, and everything else to the monolith, so public
# URLs do not change when a context moves.
name: edemand

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      edemand:
        condition: service_healthy
      notifications:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  edemand:
    build:
      context: .
      target: runtime
    # No host port: the monolith is reachable only through the gateway now.
    expose:
      - "3000"
    depends_on:
      # The monolith fetches the realm JWKS at boot (with retries); keycloak must at least have
      # started. Its own /api/health stays red until the keys are loaded, so the gateway waits.
      keycloak:
        condition: service_started
      # Area C: the outbox relay publishes to RabbitMQ and the saga consumer binds its queue at boot.
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Area B: Keycloak is the only token issuer. JWT_SECRET is retained for the node:test suite
      # (which has no Keycloak); the HS256 path is disabled whenever KEYCLOAK_URL is set.
      JWT_SECRET: ${JWT_SECRET:-dev secret - do not use in production}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: edemand
      KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
      KEYCLOAK_AUDIENCE: edemand-api
      KEYCLOAK_CLIENT_ID: edemand-web
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      NOTIFICATIONS_SERVICE_URL: http://notifications:3001
      NOTIFICATIONS_TIMEOUT_MS: "3000"
      # Area A, second extraction: wallet/ledger calls cross this seam.
      PAYMENTS_SERVICE_URL: http://payments:3002
      PAYMENTS_TIMEOUT_MS: "3000"
      # Area D: three attempts, exponential backoff with full jitter.
      PAYMENTS_MAX_ATTEMPTS: "3"
      PAYMENTS_RETRY_BASE_MS: "250"
      PAYMENTS_RETRY_MAX_MS: "4000"
      # Area E: one trace across the HTTP and RabbitMQ seams.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: edemand
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-edemand-webhook-secret}
      # Area C: the only path for domain events across the boundary.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edemand}:${RABBITMQ_PASSWORD:-edemand-demo-pass}@rabbitmq:5672
      RABBITMQ_EXCHANGE: edemand.events
      NOTIFICATIONS_QUEUE: edemand.notifications
      SAGA_QUEUE: edemand.sagas
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # Keycloak's realm import must finish before the monolith can load JWKS and go healthy.
      start_period: 60s
      retries: 6

  # docker compose run --rm test
  # Boots its own in-memory database (see test-helpers/boot.js), so it does not need `edemand`
  # running — no depends_on.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["npm", "test"]

  # Area B identity provider. The realm import is deterministic: same users, roles, clients and
  # protocol mappers on every clean boot. Published on 8081 so a demo script can request real
  # tokens for the forged / expired / wrong-audience cases. The API itself still enters through
  # the gateway on 3000; Keycloak is not part of the domain API surface.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed frontend URL: tokens always carry iss=http://localhost:8081/realms/edemand, whether
      # they were requested from the host or by the monolith over the compose network.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-edemand.json:/opt/keycloak/data/import/realm-edemand.json:ro

  notifications-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-notifications_db}
    # Not published: only the notifications service needs it.
    expose:
      - "5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-notifications_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  notifications:
    build:
      context: ./notifications-service
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@notifications-db:5432/${POSTGRES_DB:-notifications_db}
      # Area B: the service verifies Keycloak-issued RS256 tokens itself via the realm JWKS.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: edemand
      KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
      KEYCLOAK_AUDIENCE: edemand-api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      # Area C: consume domain events and publish saga outcomes on the same exchange.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-edemand}:${RABBITMQ_PASSWORD:-edemand-demo-pass}@rabbitmq:5672
      RABBITMQ_EXCHANGE: edemand.events
      NOTIFICATIONS_QUEUE: edemand.notifications
      # Area E: continue the traceparent carried on each RabbitMQ message.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: notifications
    depends_on:
      notifications-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # The service also waits for the realm JWKS before it starts listening.
      start_period: 60s
      retries: 6

  # ---- Area A, second extraction: Payments & Wallet -------------------------------------------
  payments-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${PAYMENTS_DB:-payments_db}
    # Not published: only the payments service needs it.
    expose:
      - "5432"
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${PAYMENTS_DB:-payments_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  payments:
    build:
      context: ./payments-service
    expose:
      - "3002"
    environment:
      PORT: "3002"
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@payments-db:5432/${PAYMENTS_DB:-payments_db}
      # Area B: verifies Keycloak-issued RS256 tokens itself via the realm JWKS.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: edemand
      KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
      KEYCLOAK_AUDIENCE: edemand-api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-edemand-webhook-secret}
      # After money commits, tell the order owner (the monolith) over an internal idempotent call.
      BOOKING_SERVICE_URL: http://edemand:3000
      BOOKING_TIMEOUT_MS: "3000"
      # Area E: continue the traceparent from the monolith and inject it on the way back.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: payments
    depends_on:
      payments-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      # Needs the order-side internal endpoint, so start after the monolith is healthy.
      edemand:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # The service also waits for the realm JWKS before it starts listening.
      start_period: 60s
      retries: 6

  # Area C broker. The management console is published for the demo (beat4 / trace inspection);
  # 5672 is exposed on the host so an operator can point `amqp` tooling at the stack.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edemand}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edemand-demo-pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ---- Area E: observability ----------------------------------------------------------------
  # Jaeger all-in-one receives OTLP/HTTP on 4318 and serves the trace UI on 16686. A demo opens
  # the UI, pastes the x-trace-id from a response header (or clicks the Jaeger link printed by
  # scripts/beat4-find-the-trace.sh) and sees one trace spanning all three services.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:16686/"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Prometheus scrapes each service's /metrics over the compose network. nginx does not route
  # /metrics, so the endpoint is internal even though every service exposes it.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=6h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      edemand:
        condition: service_healthy
      notifications:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Grafana is pre-provisioned: the Prometheus datasource and the "services at a glance"
  # dashboard are loaded from disk, so a clean boot needs no clicking. Anonymous admin is fine
  # for a local demo; this is not the product's auth boundary.
  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3005:3000"
    depends_on:
      - prometheus

volumes:
  notifications-db-data:
  payments-db-data:
  rabbitmq-data:
  grafana-data:
