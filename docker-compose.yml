# Area A: the only published entry point. nginx routes /api/notifications to the extracted service
# and everything else to the monolith, so public URLs do not change when a context moves.
name: edemand

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      edemand:
        condition: service_healthy
      notifications:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  edemand:
    build:
      context: .
      target: runtime
    # No host port: the monolith is reachable only through the gateway now.
    expose:
      - "3000"
    depends_on:
      # The monolith fetches the realm JWKS at boot (with retries); keycloak must at least have
      # started. Its own /api/health stays red until the keys are loaded, so the gateway waits.
      keycloak:
        condition: service_started
    environment:
      NODE_ENV: production
      # Area B: Keycloak is the only token issuer. JWT_SECRET is retained for the node:test suite
      # (which has no Keycloak); the HS256 path is disabled whenever KEYCLOAK_URL is set.
      JWT_SECRET: ${JWT_SECRET:-dev secret - do not use in production}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: edemand
      KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
      KEYCLOAK_AUDIENCE: edemand-api
      KEYCLOAK_CLIENT_ID: edemand-web
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      NOTIFICATIONS_SERVICE_URL: http://notifications:3001
      NOTIFICATIONS_TIMEOUT_MS: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # Keycloak's realm import must finish before the monolith can load JWKS and go healthy.
      start_period: 60s
      retries: 6

  # docker compose run --rm test
  # Boots its own in-memory database (see test-helpers/boot.js), so it does not need `edemand`
  # running — no depends_on.
  test:
    profiles: ["test"]
    build:
      context: .
      target: test
    command: ["npm", "test"]

  # Area B identity provider. The realm import is deterministic: same users, roles, clients and
  # protocol mappers on every clean boot. Published on 8081 so a demo script can request real
  # tokens for the forged / expired / wrong-audience cases. The API itself still enters through
  # the gateway on 3000; Keycloak is not part of the domain API surface.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fixed frontend URL: tokens always carry iss=http://localhost:8081/realms/edemand, whether
      # they were requested from the host or by the monolith over the compose network.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-edemand.json:/opt/keycloak/data/import/realm-edemand.json:ro

  notifications-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-notifications_db}
    # Not published: only the notifications service needs it.
    expose:
      - "5432"
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-notifications_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  notifications:
    build:
      context: ./notifications-service
    expose:
      - "3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@notifications-db:5432/${POSTGRES_DB:-notifications_db}
      # Area B: the service verifies Keycloak-issued RS256 tokens itself via the realm JWKS.
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: edemand
      KEYCLOAK_ISSUER: http://localhost:8081/realms/edemand
      KEYCLOAK_AUDIENCE: edemand-api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    depends_on:
      notifications-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      # The service also waits for the realm JWKS before it starts listening.
      start_period: 60s
      retries: 6

volumes:
  notifications-db-data:
