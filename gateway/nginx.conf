# Area A gateway. Public traffic keeps the SAME addresses it had before extraction:
#   http://localhost:3000/api/notifications*      -> notifications service (own Postgres DB)
#   http://localhost:3000/api/provider/wallet     -> payments service (own Postgres DB)
#   http://localhost:3000/api/customer/transactions -> payments service (own Postgres DB)
#   http://localhost:3000/api/payments/webhook    -> payments service (own Postgres DB)
#   http://localhost:3000/*                       -> Next.js monolith
#
# nginx is the only published port; the extracted services are reachable only on the compose
# network. That is what makes "the web page and mobile app still work at the same addresses" true
# rather than aspirational.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Preserve a caller-supplied correlation id, otherwise mint one at the edge. The monolith and the
  # notifications service both log/echo it, which is the seed for the Area E trace.
  map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    # Docker's embedded DNS. `upstream` blocks resolve once at start-up, so recreating a service
    # (docker compose up after a rebuild) leaves nginx pointing at a dead IP. Resolving the names
    # per request with a short TTL keeps the gateway correct across container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $monolith_upstream http://edemand:3000;
    set $notifications_upstream http://notifications:3001;
    set $payments_upstream http://payments:3002;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $correlation_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;

    # Internal service-to-service endpoints are never part of the public API.
    location ^~ /api/internal {
      return 404;
    }
    # Area E: metrics are scraped over the compose network, never through the gateway.
    location = /metrics {
      return 404;
    }
    # Area D: the fault switches must not be reachable from a browser.
    location ^~ /internal {
      return 404;
    }

    # The first extracted context. Longest-prefix match wins over `location /`.
    location ^~ /api/notifications {
      proxy_pass $notifications_upstream;
    }

    # The second extracted context: wallet/ledger reads and the gateway callback.
    # /api/payments/simulate deliberately stays on the monolith: only it owns orders and can prove
    # the caller is the customer on the booking before the money service settles it.
    location ^~ /api/provider/wallet {
      proxy_pass $payments_upstream;
    }
    location ^~ /api/customer/transactions {
      proxy_pass $payments_upstream;
    }
    location ^~ /api/payments/webhook {
      proxy_pass $payments_upstream;
    }

    # Everything else is still the monolith.
    location / {
      proxy_pass $monolith_upstream;
    }
  }
}
